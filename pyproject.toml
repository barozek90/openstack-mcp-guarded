[project]
name = "openstack-mcp-guarded"
version = "0.1.0"
description = "OpenStack MCP server with server-side policy guardrails (read-only by default) - wrapper around python-openstackmcp-server"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "python-openstackmcp-server>=1.0.0",
    "fastmcp>=2.11.3",
    "pyyaml>=6.0",
]

[project.scripts]
openstack-mcp-guarded = "openstack_mcp_guarded:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openstack_mcp_guarded"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
